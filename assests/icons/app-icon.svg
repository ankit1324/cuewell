  <path d="M422.25 281H601.75C642.42 281 662.76 281 684.65 287.92C708.55 296.62 727.38 315.45 736.08 339.35C743 361.24 743 381.58 743 422.25V565.75C743 606.42 743 626.76 736.08 648.65C727.38 672.55 708.55 691.38 684.65 700.08C662.76 707 642.42 707 601.75 707H422.25C381.58 707 361.24 707 339.35 700.08C315.45 691.38 296.62 672.55 287.92 648.65C281 626.76 281 606.42 281 565.75V422.25C281 381.58 281 361.24 287.92 339.35C296.62 315.45 315.45 296.62 339.35 287.92C361.24 281 381.58 281 422.25 281Z" fill="none" stroke="url(#face-edge)" stroke-width="4" clip-path="url(#face-clip)"/>

