<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Cuewell</title>
  <!-- macOS Big Sur icon grid: 824x824 body centred on a 1024 canvas (100px margin),
       continuous-corner radius 185.4 (22.5%). Keycap is 56% of the body.
       "C" is drawn as paths (no font needed): a circular outer edge and a
       slightly taller inner ellipse, so the sides are a little heavier than the
       top and bottom, matching the old Manrope ExtraBold S. The terminals are cut
       along radii at 42 degrees. It is shifted right of the keycap centre so its
       weight, not its bounding box, sits in the middle. -->
  <defs>
    <linearGradient id="body-fill" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="body-edge" x1="0" y1="100" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lip-fill" x1="0" y1="667" x2="0" y2="743" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9dbc52"/>
      <stop offset="1" stop-color="#86a243"/>
    </linearGradient>
    <linearGradient id="face-sheen" x1="0" y1="281" x2="0" y2="707" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="face-edge" x1="0" y1="281" x2="0" y2="371" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body-clip"><path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z"/></clipPath>
    <clipPath id="face-clip"><path d="M422.25 281H601.75C642.42 281 662.76 281 684.65 287.92C708.55 296.62 727.38 315.45 736.08 339.35C743 361.24 743 381.58 743 422.25V565.75C743 606.42 743 626.76 736.08 648.65C727.38 672.55 708.55 691.38 684.65 700.08C662.76 707 642.42 707 601.75 707H422.25C381.58 707 361.24 707 339.35 700.08C315.45 691.38 296.62 672.55 287.92 648.65C281 626.76 281 606.42 281 565.75V422.25C281 381.58 281 361.24 287.92 339.35C296.62 315.45 315.45 296.62 339.35 287.92C361.24 281 381.58 281 422.25 281Z"/></clipPath>
    <filter id="body-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <filter id="key-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity=".45"/>
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity=".45"/>
    </filter>
  </defs>

