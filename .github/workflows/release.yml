name: Build & Release

# Builds Cuewell on each OS's own runner (macOS, Windows, Linux). A pushed
# version tag (v1.2.3) also publishes a GitHub release with the installers.
# Builds are not code signed; see the README.

on:
  push:
    tags:
      - 'v*'
  # Manual runs build and upload the artifacts only; they never publish.
  workflow_dispatch:

# Read-only by default; only the release job can write (to publish).
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: mac
            artifact_glob: |
              dist/Cuewell-*-mac-*.dmg
              dist/Cuewell-*-mac-*.zip
          - name: Windows
            os: windows-latest
            script: win
            artifact_glob: |
              dist/Cuewell-*-win-*-setup.exe
              dist/Cuewell-*-win-*-portable.exe
          - name: Linux
            os: ubuntu-latest
            script: linux
            artifact_glob: |
              dist/Cuewell-*-linux-*.AppImage
              dist/Cuewell-*-linux-*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # package.json requires Node 22.12 or newer; '22' is the latest 22.x.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # electron-builder names artifacts after package.json's version
      # (Cuewell-1.0.0-win-x64-setup.exe). Match it to the tag (v1.2.3) so
      # artifact names agree with the release. `npm pkg set` does not touch git.
      - name: Sync package.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v1.2.3"
            exit 1
          fi
          CURRENT=$(node -p "require('./package.json').version")
          echo "Tag version: $VERSION, package.json version: $CURRENT"
          if [ "$VERSION" != "$CURRENT" ]; then
            npm pkg set "version=$VERSION"
          fi

      - name: Build
        shell: bash
        env:
          # Intentionally do NOT set CSC_LINK / WIN_CSC_LINK etc.
          # electron-builder treats empty strings as "set but invalid"
          # and tries to resolve them as certificate paths, producing
          # "Env WIN_CSC_LINK is not correct" errors. Code signing is
          # opt-in: add the secrets to the repo and wire them in here
          # only when you have real certificates.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:${{ matrix.script }} -- --publish never

      - name: List build output
        shell: bash
        run: ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuewell-${{ matrix.script }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Generate commit changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          REPO_URL="https://github.com/${{ github.repository }}"

          PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            # On the first release there is no other tag: grep matches nothing
            # and exits 1, which pipefail would turn into a failed step.
            PREV_TAG=$( { git tag --sort=-creatordate | grep -vx "${CURRENT_TAG}" || true; } | while read -r t; do
              if git merge-base --is-ancestor "$t" "${CURRENT_TAG}" 2>/dev/null; then echo "$t"; break; fi
            done | head -1)
          fi

          if [ -z "$PREV_TAG" ]; then
            RANGE=""
            RANGE_LABEL="Initial release"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            RANGE_LABEL="[\`${PREV_TAG}...${CURRENT_TAG}\`](${REPO_URL}/compare/${PREV_TAG}...${CURRENT_TAG})"
          fi

          COMMIT_COUNT=$(git rev-list --count ${RANGE:-HEAD})
          echo "Changelog range: ${RANGE:-<all commits>} (${COMMIT_COUNT} commits)"

          FS_CHAR="$(printf '\037')"
          git log ${RANGE:-} --reverse --pretty=format:'%H%x1f%s' | awk -v FS="$FS_CHAR" -v repo="$REPO_URL" '
            {
              short=substr($1,1,7); subj=$2; low=tolower(subj); clean=subj;
              sub(/^([Ff]eat|[Ff]ix|[Dd]ocs|[Cc]hore|[Rr]efactor|[Pp]erf|[Tt]est|[Bb]uild|[Cc]i|[Ss]tyle)(\([^)]*\))?!?:[ ]*/, "", clean);
              line="- " clean " ([`" short "`](" repo "/commit/" $1 "))";
              if (low ~ /^(feat|add|introduc|new )/) f[++nf]=line;
              else if (low ~ /(^fix|bug|hotfix)/) x[++nx]=line;
              else if (low ~ /^(improv|update|refactor|perf|polish|enhance|optimi)/) m[++ni]=line;
              else if (low ~ /^(doc|readme)/) d[++nd]=line;
              else o[++no]=line;
            }
            END {
              if (nf) { print "### Features"; print ""; for(i=1;i<=nf;i++) print f[i]; print "" }
              if (nx) { print "### Fixes"; print ""; for(i=1;i<=nx;i++) print x[i]; print "" }
              if (ni) { print "### Improvements"; print ""; for(i=1;i<=ni;i++) print m[i]; print "" }
              if (nd) { print "### Documentation"; print ""; for(i=1;i<=nd;i++) print d[i]; print "" }
              if (no) { print "### Other Changes"; print ""; for(i=1;i<=no;i++) print o[i]; print "" }
            }' > CHANGELOG_SECTION.md

          {
            echo "### Summary"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "This release includes **${COMMIT_COUNT} commits** since ${PREV_TAG}."
            else
              echo "First release of Cuewell — **${COMMIT_COUNT} commits**."
            fi
            echo ""
            cat CHANGELOG_SECTION.md
          } > WHATS_CHANGED.md

          # Write combined body to file (multiline-safe). The heredoc is quoted
          # so backticks stay literal; __REPO_URL__ is filled in afterwards.
          cat > RELEASE_BODY.md << 'BODY_EOF'
          ## Installation

          Download the file for your system:

          | System | File | Notes |
          |---|---|---|
          | **Windows 10 or later (64-bit)** | `Cuewell-*-win-x64-setup.exe` | Installer. Installs for your account only (no admin needed) and adds Start menu and desktop shortcuts. |
          | **Windows** | `Cuewell-*-win-x64-portable.exe` | Runs without installing. |
          | **macOS 13 or later, Apple silicon** | `Cuewell-*-mac-arm64.dmg` | Drag Cuewell to Applications. |
          | **macOS 13 or later, Intel** | `Cuewell-*-mac-x64.dmg` | Drag Cuewell to Applications. |
          | **Debian, Ubuntu** | `Cuewell-*-linux-amd64.deb` | `sudo apt install ./Cuewell-*-linux-amd64.deb` |
          | **Other Linux (64-bit)** | `Cuewell-*-linux-x86_64.AppImage` | `chmod +x` the file, then run it. |

          These builds are **not code signed**:

          - **Windows:** SmartScreen shows "Windows protected your PC". Choose **More info**, then **Run anyway**.
          - **macOS:** the first launch is blocked. Open **System Settings > Privacy & Security**, scroll down and choose **Open Anyway** for Cuewell. If macOS says the app is damaged, run `xattr -dr com.apple.quarantine /Applications/Cuewell.app` in Terminal, or run Cuewell from source with `./setup.sh`.
          - **Linux:** privacy mode (hiding the windows from screen sharing) is not available.

          ## First run

          Cuewell opens a setup wizard on first launch. Choose an AI provider (Gemini, Claude, OpenAI, OpenRouter, Groq, DeepSeek or a local Ollama model), enter its key, and optionally set up voice input.

          ## Optional: local Whisper (offline voice)

          The setup wizard can install Whisper for you. It needs **Python 3.10 or newer** (3.12 recommended) and 3 to 5 GB of disk space. On Linux, voice input also needs `arecord` (alsa-utils) or `sox`; the .deb installs it.

          See the [README](__REPO_URL__#readme) for details.

          ## Checksums

          See `SHA256SUMS.txt` attached to this release.

          BODY_EOF

          {
            echo ""
            echo "## What's Changed"
            echo ""
            cat WHATS_CHANGED.md
            echo ""
            echo "**Full Changelog**: ${RANGE_LABEL}"
          } >> RELEASE_BODY.md

          sed -i "s#__REPO_URL__#${REPO_URL}#g" RELEASE_BODY.md

          echo "=== Final release body ==="
          cat RELEASE_BODY.md

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          # Installers only. This drops .blockmap files and latest-*.yml
          # (electron-updater metadata). The macOS .zip files are kept: the
          # website links them. The order below is the order on the release page.
          for pattern in 'Cuewell-*-win-*-setup.exe' 'Cuewell-*-win-*-portable.exe' \
                         'Cuewell-*-mac-*.dmg' 'Cuewell-*-mac-*.zip' \
                         'Cuewell-*-linux-*.deb' 'Cuewell-*-linux-*.AppImage'; do
            found=$(find artifacts -type f -name "$pattern")
            if [ -z "$found" ]; then
              echo "::error::No artifact matches $pattern"
              exit 1
            fi
            find artifacts -type f -name "$pattern" -exec cp -v {} release/ \;
          done
          echo "--- Files selected for release ---"
          ls -la release/

      - name: Generate SHA256 checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cuewell ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_BODY.md
          files: |
            release/*
          fail_on_unmatched_files: true
