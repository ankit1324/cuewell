<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Chat</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <link rel="stylesheet" href="./assests/vendor/fontawesome/all.min.css" />
    <style>
      /* Chat panel. Tokens and primitives come from src/styles/theme.css,
         which is linked last, so rules here that must beat a theme rule use
         a more specific selector. */

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent !important;
        overflow: hidden;
      }

      /* ---------- Window ---------- */

      .chat-container {
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }

      .chat-header .header-title { flex: 1; min-width: 0; }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        -webkit-app-region: no-drag;
      }

      /* Shown by JS with style.display = 'block' while recording. */
      .recording-indicator {
        display: none;
        -webkit-app-region: no-drag;
      }

      /* ---------- Messages ---------- */

      .chat-messages {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        overflow-y: auto;
        overflow-x: hidden;
        box-sizing: border-box;
        -webkit-app-region: no-drag;
      }

      /* Reset the legacy .message look from common.css. */
      .chat-messages .message {
        position: relative;
        flex: none;
        margin: 0;
        padding: 0;
        background: none;
        border: 0;
        border-radius: 0;
        backdrop-filter: none;
        overflow-wrap: anywhere;
        word-break: normal;
      }

      .chat-messages .message-text {
        display: block;
        max-width: 100%;
        font-size: var(--oc-fs-md);
        line-height: 1.55;
        color: var(--oc-text);
        text-shadow: none;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: normal;
      }

      .message-text .math {
        font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
        white-space: nowrap;
      }
      .message-text sup,
      .message-text sub {
        font-size: 0.72em;
        line-height: 0;
      }

      /* Timestamps live in the head row of heard and assistant messages;
         elsewhere they stay in the DOM but are not shown. */
      .chat-messages .message > .message-time { display: none; }

      .message-head {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 16px;
        margin-bottom: 6px;
      }
      .message-head .oc-mark { --s: 12px; }
      .message-head .oc-label { color: var(--oc-text-3); }
      .chat-messages .message-head .message-time {
        display: inline;
        margin: 0;
        font-family: var(--oc-mono);
        font-size: var(--oc-fs-2xs);
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--oc-text-4);
      }

      /* Typed by the user: right-aligned lime-tinted bubble. */
      .chat-messages .message.user {
        align-self: flex-end;
        max-width: 82%;
        padding: 8px 12px;
        background: var(--oc-accent-soft);
        border: 1px solid var(--oc-accent-line);
        border-radius: 14px 14px 4px 14px;
      }

      /* Heard from the mic: quiet, left rule, no fill. */
      .chat-messages .message.transcription {
        padding-left: 10px;
        border-left: 2px solid var(--oc-line-2);
      }
      .chat-messages .message.transcription .message-text { color: var(--oc-text-2); }

      /* AI answer: full width, no bubble. */
      .chat-messages .message.assistant .message-text {
        white-space: normal;
        line-height: 1.62;
      }
      .chat-messages .message.assistant.streaming .message-text { white-space: pre-wrap; }

      /* Consecutive code snippets belong to the answer above them. */
      .chat-messages .message.assistant:not(.thinking) + .message.snippet { margin-top: -4px; }
      .chat-messages .message.assistant:not(.thinking) + .message.snippet .message-head { display: none; }

      /* common.css styles .message.assistant code with its own font and
         colors; restate the theme values at a higher specificity. */
      .chat-messages .message.assistant code {
        display: inline;
        padding: 0.1em 0.38em;
        font-family: var(--oc-mono);
        font-size: 0.88em;
        color: #ecebe5;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--oc-line);
        border-radius: var(--oc-r-xs);
      }
      .chat-messages .message.assistant pre code {
        display: block;
        padding: 0;
        font-size: 12.5px;
        line-height: 1.6;
        color: #e6e4dd;
        background: none;
        border: 0;
        border-radius: 0;
        white-space: pre;
      }
      .chat-messages .message.assistant strong { font-weight: 700; color: #ffffff; }
      /* Mono list numbers need a little more room than theme.css gives. */
      .chat-messages .message.assistant ol { padding-left: 1.7em; }

      /* Code snippet card: label + copy in a head bar, code below. */
      .code-block {
        overflow: hidden;
        background: var(--oc-sunken);
        border: 1px solid var(--oc-line);
        border-radius: var(--oc-r-md);
      }
      .code-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        height: 30px;
        padding: 0 6px 0 12px;
        border-bottom: 1px solid var(--oc-line);
      }
      .oc-prose .code-block pre {
        margin: 0;
        padding: 12px 14px;
        overflow: auto;
        background: transparent;
        border: 0;
        border-radius: 0;
      }

      .copy-btn {
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 8px;
        font-family: var(--oc-mono);
        font-size: var(--oc-fs-2xs);
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--oc-text-2);
        background: transparent;
        border: 1px solid var(--oc-line);
        border-radius: var(--oc-r-sm);
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition:
          background var(--oc-t-fast) var(--oc-ease),
          border-color var(--oc-t-fast) var(--oc-ease),
          color var(--oc-t-fast) var(--oc-ease);
      }
      .copy-btn:hover {
        color: var(--oc-text);
        background: var(--oc-raised-2);
        border-color: var(--oc-line-2);
      }
      .copy-btn.copied {
        color: var(--oc-accent);
        background: var(--oc-accent-soft);
        border-color: var(--oc-accent-line);
      }

      /* Status lines. */
      .chat-messages .message.system {
        align-self: center;
        max-width: 90%;
        text-align: center;
      }
      .chat-messages .message.system .message-text {
        font-size: var(--oc-fs-xs);
        line-height: 1.45;
        color: var(--oc-text-3);
      }

      .chat-messages .message.error {
        padding: 8px 12px;
        background: var(--oc-error-soft);
        border-left: 2px solid var(--oc-error);
        border-radius: 0 var(--oc-r-md) var(--oc-r-md) 0;
      }
      .chat-messages .message.error .message-text {
        font-size: var(--oc-fs-sm);
        color: var(--oc-text);
      }

      .chat-messages .message.thinking { animation: oc-rise var(--oc-t) var(--oc-ease) both; }
      .chat-messages .message.thinking .message-text { font-size: var(--oc-fs-sm); font-weight: 600; }

      /* ---------- Live partial transcription ---------- */

      .interim-overlay {
        display: none;
        position: relative;
        flex: none;
        height: 28px;
        margin: 0 12px 8px;
        padding: 0 12px 0 27px;
        box-sizing: border-box;
        font-size: var(--oc-fs-sm);
        font-style: italic;
        line-height: 26px;
        color: var(--oc-text-2);
        background: var(--oc-raised);
        border: 1px solid var(--oc-line);
        border-radius: var(--oc-r-pill);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      /* JS writes the text with textContent, so the live dot is a pseudo-element
         drawn like .oc-dot.oc-dot--live. */
      .interim-overlay::before {
        content: '';
        position: absolute;
        left: 11px;
        top: 50%;
        width: 7px;
        height: 7px;
        margin-top: -3.5px;
        border-radius: 50%;
        background: var(--oc-live);
        animation: oc-pulse 1.6s var(--oc-ease) infinite;
      }
      .interim-overlay.active {
        display: block;
        animation: oc-rise var(--oc-t) var(--oc-ease) both;
      }

      /* ---------- Composer ---------- */

      .chat-input {
        flex: none;
        padding: 0 12px 12px;
        -webkit-app-region: no-drag;
      }

      .input-container {
        display: flex;
        flex-direction: column;
        background: var(--oc-sunken);
        border: 1px solid var(--oc-line-2);
        border-radius: var(--oc-r-lg);
        transition:
          border-color var(--oc-t-fast) var(--oc-ease),
          box-shadow var(--oc-t-fast) var(--oc-ease),
          opacity var(--oc-t-fast) var(--oc-ease);
        -webkit-app-region: no-drag;
      }
      .input-container:focus-within {
        border-color: var(--oc-accent-line);
        box-shadow: 0 0 0 3px var(--oc-accent-soft);
      }

      .input-field {
        display: block;
        width: 100%;
        box-sizing: border-box;
        min-height: 38px;
        max-height: 140px;
        margin: 0;
        padding: 10px 12px 4px;
        font: 500 var(--oc-fs-md)/1.5 var(--oc-font);
        color: var(--oc-text);
        background: transparent;
        border: 0;
        outline: none;
        resize: none;
        overflow-y: auto;
      }
      .input-field:focus,
      .input-field:focus-visible { outline: none; }
      .input-field::placeholder { color: var(--oc-text-4); }

      .input-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px 6px 12px;
      }
      .input-hints {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font-size: var(--oc-fs-xs);
        color: var(--oc-text-4);
        white-space: nowrap;
        user-select: none;
      }
      .input-hints .oc-kbd-group { gap: 5px; }
      .input-hints .oc-kbd { color: var(--oc-text-3); }

      .input-actions .mic-button.recording,
      .input-actions .mic-button.recording:hover {
        color: var(--oc-live);
        background: var(--oc-live-soft);
      }

      /* Click-through mode (toggled on #chatContainer). */
      .non-interactive .input-container,
      .non-interactive .mic-button,
      .non-interactive .send-button {
        pointer-events: none;
        opacity: 0.5;
      }
    </style>
    <link rel="stylesheet" href="./src/styles/theme.css" />
  </head>
  <body>
    <div class="chat-container oc-window oc-window--native" id="chatContainer">
      <header class="chat-header oc-titlebar oc-drag">
        <span class="oc-mark" aria-hidden="true"></span>
        <span class="header-title oc-title">Chat</span>
        <div class="recording-indicator" id="recordingIndicator" role="status">
          <span class="oc-chip oc-chip--live"><span class="oc-dot oc-dot--live" aria-hidden="true"></span>Listening</span>
        </div>
        <div class="header-actions">
          <button class="oc-btn oc-btn--ghost oc-icon-btn" id="clearHistoryBtn" type="button" title="Clear chat history" aria-label="Clear chat history">
            <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

      <!-- Live partial transcription, pinned above the input -->
      <div class="interim-overlay" id="interimOverlay" aria-live="polite"></div>

      <div class="chat-input">
        <div class="input-container">
          <textarea
            class="input-field"
            placeholder="Ask anything…"
            id="messageInput"
            rows="1"
            aria-label="Message"
          ></textarea>
          <div class="input-actions">
            <div class="input-hints" aria-hidden="true">
              <span class="oc-kbd-group"><span class="oc-kbd">↵</span>send</span>
              <span class="oc-kbd-group"><span class="oc-kbd">⇧↵</span>new line</span>
            </div>
            <button class="mic-button oc-btn oc-btn--ghost oc-icon-btn" id="micButton" type="button" title="Voice input (Alt+R)" aria-label="Start or stop voice input">
              <i class="fa-solid fa-microphone" aria-hidden="true"></i>
            </button>
            <button class="send-button oc-send" id="sendButton" type="button" title="Send" aria-label="Send message">
              <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="./node_modules/dompurify/dist/purify.min.js"></script>
    <script src="lib/safe-html.js"></script>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- PrismJS core (bundled with markup, css, clike and javascript) and the
         autoloader, which adds other languages from components/ on demand -->
    <script src="./node_modules/prismjs/prism.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
      // Configure Prism autoloader
      try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}
    </script>
    <script>
      // Use electronAPI from preload script instead of direct require
      const whysperAPI = window.electronAPI;

      const chatMessages = document.getElementById('chatMessages');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const micButton = document.getElementById('micButton');
      const chatContainer = document.getElementById('chatContainer');
      const listeningIndicator = document.getElementById('listeningIndicator');
      const listeningDuration = document.getElementById('listeningDuration');
      const interimOverlay = document.getElementById('interimOverlay');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');

      let isRecording = false;
      let isInteractive = true;
      let listeningStartTime = null;
      let listeningTimer = null;
      let speechAvailable = false;

      // Chat persistence and deduplication
      const CHAT_HISTORY_KEY = 'opencluely_chat_history_v1';
      let chatHistory = [];
      const recentResponseHashes = new Set();
      const RECENT_HASH_LIMIT = 50;

      function hashString(str) {
        try {
          let h = 2166136261 >>> 0; // FNV-1a
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(16);
        } catch (_) {
          return String(str?.length || 0);
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory.slice(-500)));
        } catch (e) {
          console.warn('Failed to save history', e);
        }
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(CHAT_HISTORY_KEY);
          if (!raw) return;
          const items = JSON.parse(raw);
          if (Array.isArray(items)) {
            chatHistory = items;
            // Render
            items.forEach(item => {
              if (item.kind === 'message') {
                addMessage(item.text, item.type, true);
              } else if (item.kind === 'snippet') {
                addCodeSnippet(item.language, item.code, true);
              }
            });
          }
        } catch (e) {
          console.warn('Failed to load history', e);
        }
      }

      function clearChatHistory(skipConfirm = false) {
        if (!skipConfirm) {
          const ok = confirm('Clear chat history?');
          if (!ok) return;
        }
        chatHistory = [];
        saveHistory();
        // Clear DOM
        if (chatMessages) chatMessages.innerHTML = '';
      }

      function applyMicVisibility() {
        if (micButton) {
          micButton.style.display = speechAvailable ? '' : 'none';
        }
      }
      
      async function initSpeechAvailability() {
        try {
          if (window.electronAPI && window.electronAPI.getSpeechAvailability) {
            speechAvailable = await window.electronAPI.getSpeechAvailability();
            applyMicVisibility();
          }
        } catch (e) {
          speechAvailable = false;
          applyMicVisibility();
        }
      }
      
      // Listen for availability changes
      if (whysperAPI && whysperAPI.onSpeechAvailability) {
        whysperAPI.onSpeechAvailability((event, data) => {
          speechAvailable = !!(data && data.available);
          applyMicVisibility();
        });
      }
      
      // Also capture generic LLM responses (from OCR/screenshot flows)
      if (whysperAPI && whysperAPI.onLlmResponse) {
        whysperAPI.onLlmResponse((event, data) => {
          try { hideThinkingIndicator(); } catch (_) {}
          if (data && data.response) {
            renderAssistantResponse(data.response);
          }
        });
      }

      // Clear on session-cleared from main
      if (whysperAPI && whysperAPI.onSessionCleared) {
        whysperAPI.onSessionCleared(() => {
          clearChatHistory(true);
        });
      }

      // Initialize availability and history
      loadHistory();
      initSpeechAvailability();

      // Small head row above heard and assistant messages: a label (plus the
      // brand mark for assistant) and the timestamp.
      function buildMessageHead(type, timeDiv) {
        const head = document.createElement('div');
        head.className = 'message-head';
        if (type !== 'transcription') {
          const mark = document.createElement('span');
          mark.className = 'oc-mark';
          mark.setAttribute('aria-hidden', 'true');
          head.appendChild(mark);
        }
        const label = document.createElement('span');
        label.className = 'oc-label';
        label.textContent = type === 'transcription' ? 'Heard' : 'OpenCluely';
        head.appendChild(label);
        head.appendChild(timeDiv);
        return head;
      }

      // Basic message function with markdown support for assistant messages
      function addMessage(text, type = 'user', skipPersist = false) {
        if (!chatMessages) {
          console.error('Chat messages element not found!');
          return;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;
        // Rise in only for new messages, not when replaying saved history.
        if (!skipPersist) messageDiv.classList.add('oc-rise');

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        
        // Format assistant messages as markdown
        if (type === 'assistant') {
          textDiv.classList.add('oc-prose');
          textDiv.innerHTML = sanitizeHtml(formatMarkdown(text));
          if (window.renderMathInElement) window.renderMathInElement(textDiv);
        } else {
          textDiv.textContent = text;
        }

        if (type === 'assistant' || type === 'transcription') {
          messageDiv.appendChild(buildMessageHead(type, timeDiv));
        } else {
          messageDiv.appendChild(timeDiv);
        }
        messageDiv.appendChild(textDiv);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (!skipPersist) {
          chatHistory.push({ kind: 'message', type, text });
          saveHistory();
        }
      }

      // Markdown formatter using markdown.js library
      function formatMarkdown(text) {
        if (!text) return '';
        
        try {
          if (typeof markdown !== 'undefined' && markdown.toHTML) {
            return markdown.toHTML(text);
          } else {
            console.warn('Markdown library not loaded, falling back to basic formatting');
            return text
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g, '<em>$1</em>')
              .replace(/`(.+?)`/g, '<code>$1</code>')
              .replace(/\n/g, '<br>');
          }
        } catch (error) {
          console.error('Markdown parsing failed:', error);
          return text.replace(/\n/g, '<br>');
        }
      }

      // Show thinking indicator
      function showThinkingIndicator() {
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'message assistant thinking';
        thinkingDiv.id = 'thinking-indicator';

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        const shimmer = document.createElement('span');
        shimmer.className = 'oc-shimmer';
        shimmer.textContent = 'Thinking…';
        textDiv.appendChild(shimmer);

        thinkingDiv.appendChild(buildMessageHead('assistant', timeDiv));
        thinkingDiv.appendChild(textDiv);

        chatMessages.appendChild(thinkingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Hide thinking indicator
      function hideThinkingIndicator() {
        const thinkingIndicator = document.getElementById('thinking-indicator');
        if (thinkingIndicator) {
          thinkingIndicator.remove();
        }
      }

      // Minimalist Listening Animation Functions
      function showListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.add('active');

          // Start timer
          listeningStartTime = Date.now();
          listeningTimer = setInterval(() => {
            if (listeningStartTime && listeningDuration) {
              const elapsed = Math.floor((Date.now() - listeningStartTime) / 1000);
              listeningDuration.textContent = `${elapsed}s`;
            }
          }, 1000);
        }
      }

      function hideListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.remove('active');
        }

        // Hide interim overlay
        if (interimOverlay) {
          interimOverlay.classList.remove('active');
        }

        // Clear timer
        if (listeningTimer) {
          clearInterval(listeningTimer);
          listeningTimer = null;
        }

        listeningStartTime = null;
      }

      function showInterimText(text) {
        if (!interimOverlay) return;

        // The bar sits in the layout above the input, so showing it shrinks the
        // message list; keep the list pinned to the bottom if it was there.
        const atBottom = chatMessages &&
          chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 24;

        if (text && text.trim()) {
          interimOverlay.textContent = text;
          interimOverlay.classList.add('active');
        } else {
          interimOverlay.classList.remove('active');
        }

        if (atBottom) chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Recording Event Handlers
      function handleRecordingStarted() {
        isRecording = true;

        if (recordingIndicator) {
          recordingIndicator.style.display = 'block';
        }
        if (micButton) {
          micButton.classList.add('recording');
        }

        showListeningAnimation();
      }

      function handleRecordingStopped() {
        isRecording = false;

        if (recordingIndicator) {
          recordingIndicator.style.display = 'none';
        }
        if (micButton) {
          micButton.classList.remove('recording');
        }

        hideListeningAnimation();
        addMessage('Stopped Listening', 'system');
      }

      function handleTranscription(text) {
        if (text && typeof text === 'string' && text.trim().length > 0) {
          // Hide listening animation first
          hideListeningAnimation();

          // Show transcribed text with slight delay for smooth transition
          setTimeout(() => {
            addMessage(text.trim(), 'transcription');
            
            // Show thinking indicator after transcription
            setTimeout(() => {
              showThinkingIndicator();
            }, 300);
          }, 200);
        } else {
          console.warn('Invalid or empty transcription text - ignoring:', text);
        }
      }

      // Helpers to capture AI response into chat (text + snippets)
      function extractCodeBlocks(text) {
        if (!text) return [];
        const blocks = [];
        const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
        let match;
        while ((match = regex.exec(text)) !== null) {
          const info = (match[2] || '').trim();
          const langToken = info.split(/\s+/)[0] || 'text';
          blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
        }
        return blocks;
      }
      function stripCodeBlocks(text, blocks) {
        let result = text || '';
        blocks.forEach(b => { result = result.replace(b.fullMatch, ''); });
        return result.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
      }
      function attachCopy(btn, codeText) {
        if (!btn) return;
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            let ok = false;
            if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
              ok = await window.electronAPI.copyToClipboard(codeText);
            }
            if (!ok) {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(codeText);
                ok = true;
              } else {
                const ta = document.createElement('textarea');
                ta.value = codeText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                ok = true;
              }
            }
            if (ok) {
              btn.classList.add('copied');
              const original = btn.textContent;
              btn.textContent = 'Copied';
              setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
            }
          } catch (err) {
            console.warn('Copy failed', err);
          }
        });
      }
      function addCodeSnippet(language, code, skipPersist = false) {
        if (!chatMessages) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant snippet';
        if (!skipPersist) messageDiv.classList.add('oc-rise');
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text oc-prose';

        const lang = (language || 'text').toLowerCase();
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.className = `language-${lang}`;
        codeEl.innerHTML = escapeHtml(code || '');

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.type = 'button';
        copyBtn.setAttribute('aria-label', 'Copy code');
        copyBtn.textContent = 'Copy';
        attachCopy(copyBtn, code || '');

        pre.appendChild(codeEl);

        const label = document.createElement('span');
        label.className = 'oc-label';
        label.textContent = lang;

        const head = document.createElement('div');
        head.className = 'code-head';
        head.appendChild(label);
        head.appendChild(copyBtn);

        const block = document.createElement('div');
        block.className = 'code-block';
        block.appendChild(head);
        block.appendChild(pre);

        textDiv.appendChild(block);

        messageDiv.appendChild(buildMessageHead('assistant', timeDiv));
        messageDiv.appendChild(textDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try { if (window.Prism && Prism.highlightElement) { Prism.highlightElement(codeEl); } } catch (_) {}

        if (!skipPersist) {
          chatHistory.push({ kind: 'snippet', language: lang, code: code || '' });
          saveHistory();
        }
      }
      function renderAssistantResponse(response) {
        if (!response || typeof response !== 'string') return;
        // Deduplication: avoid processing the same response twice
        const normalized = response.trim();
        const h = hashString(normalized);
        if (recentResponseHashes.has(h)) return;
        recentResponseHashes.add(h);
        if (recentResponseHashes.size > RECENT_HASH_LIMIT) {
          const first = recentResponseHashes.values().next().value;
          recentResponseHashes.delete(first);
        }

        const blocks = extractCodeBlocks(response);
        const textOnly = stripCodeBlocks(response, blocks);
        // Add text response first (if any)
        if (textOnly && textOnly.trim().length) {
          addMessage(textOnly, 'assistant');
        }
        // Add each code snippet separately
        blocks.forEach(b => addCodeSnippet(b.language, b.code));
      }

      // Basic IPC Event Listeners - simplified
      
      // Listen for transcription events
      if (whysperAPI) {
        whysperAPI.onTranscriptionReceived((event, data) => {
          if (data && data.text) {
            handleTranscription(data.text);
          } else {
            console.warn('Invalid transcription data received:', data);
          }
        });

        whysperAPI.onInterimTranscription((event, data) => {
          if (data && data.text) {
            showInterimText(data.text);
          }
        });

        // Listen for speech status
        whysperAPI.onSpeechStatus((event, data) => {
          if (data && data.status) {
            addMessage(data.status, 'system');

            if (data.status.includes('started') || data.status.includes('Recording')) {
              handleRecordingStarted();
            } else if (data.status.includes('stopped') || data.status.includes('ended')) {
              handleRecordingStopped();
            }
          }
        });

        // Listen for speech errors
        whysperAPI.onSpeechError((event, data) => {
          if (data && data.error) {
            addMessage(`Error in recognizing speech`, 'error');
            handleRecordingStopped();
          }
        });

        // Listen for other events
        whysperAPI.onRecordingStarted(() => {
          handleRecordingStarted();
        });

        whysperAPI.onRecordingStopped(() => {
          handleRecordingStopped();
        });

        whysperAPI.onSessionCleared(() => {
          addMessage('Session memory has been cleared', 'system');
        });

        // Replace transcription LLM handler to store text + snippets
        whysperAPI.onTranscriptionLlmResponse((event, data) => {
          if (data && data.response) {
            try { hideThinkingIndicator(); } catch (_) {}
            renderAssistantResponse(data.response);
          }
        });
      }

      // UI Event Listeners
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', () => clearChatHistory());
      }

      if (micButton) {
        micButton.addEventListener('click', async () => {
          if (!isInteractive) {
            addMessage('Window is in non-interactive mode. Press Alt+A to enable interaction.', 'error');
            return;
          }
          if (!speechAvailable) {
            addMessage('Speech recognition is not configured.', 'system');
            return;
          }

          try {
            if (isRecording) {
              if (whysperAPI) {
                const result = await whysperAPI.stopSpeechRecognition();
              }
            } else {
              if (whysperAPI) {
                const result = await whysperAPI.startSpeechRecognition();
              }
            }
          } catch (error) {
            addMessage("Error in recognizing speech", 'error');
          }
        });
      }

      if (sendButton) {
        sendButton.addEventListener('click', async () => {
          const text = messageInput.value.trim();
          if (text) {
            addMessage(text, 'user');
            messageInput.value = '';
            
            // Show thinking indicator after user message
            setTimeout(() => {
              showThinkingIndicator();
            }, 300);
            
            // Send to main process for session memory storage and LLM processing
            try {
              if (whysperAPI && whysperAPI.sendChatMessage) {
                await whysperAPI.sendChatMessage(text);
              }
            } catch (error) {
              console.error('Failed to send chat message to main process:', error);
            }
          }
        });
      }

      // Auto-resize for multiline textarea
      function autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        const max = 140; // keep within container limits
        el.style.height = Math.min(el.scrollHeight, max) + 'px';
      }
      if (messageInput) {
        autoGrow(messageInput);
        messageInput.addEventListener('input', () => autoGrow(messageInput));
      }

      // Replace keypress with keydown to support Shift+Enter for newline and Enter to send
      if (messageInput) {
        messageInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (text) {
              addMessage(text, 'user');
              messageInput.value = '';
              autoGrow(messageInput);
              setTimeout(() => { showThinkingIndicator(); }, 300);
              try {
                if (whysperAPI && whysperAPI.sendChatMessage) {
                  await whysperAPI.sendChatMessage(text);
                }
              } catch (error) {
                console.error('Failed to send chat message to main process:', error);
              }
            }
          }
          // If Shift+Enter, allow default to insert newline
        });
      }

      // Global keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.altKey && e.key === 'r') {
          e.preventDefault();
          if (!isInteractive || !speechAvailable) return;
          micButton && micButton.click();
        }
      });

      // Initialize
      if (!chatHistory || chatHistory.length === 0) {
        addMessage('Recording in Progress. press Alt+R to stop recording.', 'system');
      }
    </script>
  </body>
</html>
