<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Cuewell</title>
    <link rel="stylesheet" href="./src/styles/theme.css">
    <link rel="stylesheet" href="./src/styles/icons.css">
    <link rel="stylesheet" href="./src/styles/toolbar.css">
  </head>
  <body>
    <!-- The window is sized to .command-tab (see src/styles/toolbar.css). -->
    <div class="command-tab">
      <div class="command-card">
        <!-- Row 2 (interview controls). First in the DOM: main-window.js takes
             the first .command-item as the screenshot button. CSS shows the
             brand row above it. -->
        <div class="command-controls">
          <button type="button" class="command-item" title="Screenshot and ask" aria-label="Screenshot and ask">
            <i class="fas fa-camera" aria-hidden="true"></i>
            <span class="command-label">Screenshot</span>
            <span class="oc-kbd-group" aria-hidden="true">
              <span class="oc-kbd oc-mod"></span>
              <span class="oc-kbd">⇧</span>
              <span class="oc-kbd">S</span>
            </span>
          </button>
          <button type="button" class="command-item" id="micButton" title="Listen (Alt+R)" aria-label="Toggle listening">
            <i class="fas fa-microphone" aria-hidden="true"></i>
            <span class="oc-dot oc-dot--live mic-live-dot" aria-hidden="true"></span>
            <span class="mic-labels">
              <span class="mic-label mic-label--idle">Listen</span>
              <span class="mic-label mic-label--live">Listening<svg class="mic-scribble" viewBox="0 0 60 6" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M1 3.6C8 2.2 14 4.6 21 3.4S34 1.8 41 3.6 53 4.6 59 2.6"/></svg></span>
            </span>
            <span class="oc-kbd-group" aria-hidden="true"><span class="oc-kbd oc-alt"></span><span class="oc-kbd">R</span></span>
          </button>
          <div class="command-separator" aria-hidden="true"></div>
          <button type="button" class="command-item" id="skillIndicator" title="Interview mode" aria-label="Interview mode">
            <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span>Auto</span>
            <span class="oc-kbd-group" aria-hidden="true"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">↕</span></span>
          </button>
          <div class="command-item" id="languageSelector" title="Answer language">
            <i class="fas fa-code" aria-hidden="true"></i>
            <select id="codingLanguage" aria-label="Coding language">
              <option value="cpp">C++</option>
              <option value="c">C</option>
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="javascript">JavaScript</option>
            </select>
          </div>
        </div>

        <!-- Row 1: brand, app controls and the click-through status. -->
        <div class="command-brand">
          <span class="oc-mark command-mark" aria-hidden="true"></span>
          <span class="command-wordmark">Cuewell</span>
          <span class="command-spacer" aria-hidden="true"></span>
          <button type="button" class="command-item" id="infoButton" title="Shortcuts" aria-label="Shortcuts">
            <i class="fas fa-circle-info" aria-hidden="true"></i>
          </button>
          <button type="button" class="command-item" id="settingsButton" title="Settings" aria-label="Settings">
            <i class="fas fa-gear" aria-hidden="true"></i>
            <span class="command-label">Settings</span>
            <span class="oc-kbd-group" aria-hidden="true"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">,</span></span>
          </button>
          <button type="button" class="command-item" id="moreButton" title="More" aria-label="More" aria-haspopup="menu">
            <i class="fas fa-ellipsis" aria-hidden="true"></i>
            <span class="command-label">More</span>
          </button>
          <div class="command-separator" aria-hidden="true"></div>
          <div class="status-dot non-interactive" id="statusDot" role="img" title="Click-through mode (Alt+A to interact)" aria-label="Click-through mode (Alt+A to interact)"></div>
          <span class="oc-kbd-group" aria-hidden="true"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">⇧</span><span class="oc-kbd">I</span></span>
        </div>
      </div>
    </div>

    <!-- Notice under the tab; main-window.js fills and opens it. -->
    <div id="toolbarNotice" class="toolbar-notice" role="alert">
      <i class="fas fa-microphone-slash toolbar-notice-icon" aria-hidden="true"></i>
      <p class="toolbar-notice-text" id="toolbarNoticeText"></p>
      <button type="button" class="toolbar-notice-close" id="toolbarNoticeClose" title="Dismiss" aria-label="Dismiss">
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Shortcuts popover (hidden by default via CSS) -->
    <div id="shortcutsPopover" class="shortcuts-popover">
      <div class="shortcuts-title">
        <i class="fas fa-bolt" aria-hidden="true"></i>
        <span class="oc-label">Shortcuts</span>
      </div>
      <ul class="shortcuts-list">
        <li class="shortcut-row">
          <span class="shortcut-action">Capture screenshot and analyze</span>
          <span class="shortcut-keys">
            <span class="oc-kbd-group"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">⇧</span><span class="oc-kbd">S</span></span>
          </span>
        </li>
        <li class="shortcut-row">
          <span class="shortcut-action">Toggle visibility</span>
          <span class="shortcut-keys">
            <span class="oc-kbd-group"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">⇧</span><span class="oc-kbd">V</span></span>
          </span>
        </li>
        <li class="shortcut-row">
          <span class="shortcut-action">Toggle interaction (click-through)</span>
          <span class="shortcut-keys">
            <span class="oc-kbd-group"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">⇧</span><span class="oc-kbd">I</span></span>
            <span class="shortcut-or">or</span>
            <span class="oc-kbd-group"><span class="oc-kbd oc-alt"></span><span class="oc-kbd">A</span></span>
          </span>
        </li>
        <li class="shortcut-row">
          <span class="shortcut-action">Open chat</span>
          <span class="shortcut-keys">
            <span class="oc-kbd-group"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">⇧</span><span class="oc-kbd">C</span></span>
          </span>
        </li>
        <li class="shortcut-row">
          <span class="shortcut-action">Stop the answer</span>
          <span class="shortcut-keys">
            <span class="oc-kbd-group"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">⇧</span><span class="oc-kbd">X</span></span>
          </span>
        </li>
        <li class="shortcut-row">
          <span class="shortcut-action">Toggle speech</span>
          <span class="shortcut-keys">
            <span class="oc-kbd-group"><span class="oc-kbd oc-alt"></span><span class="oc-kbd">R</span></span>
          </span>
        </li>
        <li class="shortcut-row">
          <span class="shortcut-action">Open settings</span>
          <span class="shortcut-keys">
            <span class="oc-kbd-group"><span class="oc-kbd oc-mod"></span><span class="oc-kbd">,</span></span>
          </span>
        </li>
      </ul>
      <div class="shortcuts-footer">
        <span>Tip: Alt+A also toggles interaction from anywhere.</span>
        <span class="shortcuts-credit">
          <span class="oc-mark" aria-hidden="true"></span>
          Made by Ankit Chaudhary
        </span>
      </div>
    </div>

    <script src="./src/ui/main-window.js"></script>
  </body>
</html>
