<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuewell</title>
    <script src="./node_modules/dompurify/dist/purify.min.js"></script>
    <script src="lib/safe-html.js"></script>
    <script src="./node_modules/marked/lib/marked.umd.js"></script>
    <script src="./src/ui/markdown-render.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- PrismJS core (bundled with markup, css, clike and javascript) and the
         autoloader, which adds other languages from components/ on demand.
         Token colors come from theme.css; code card styles from answer.css. -->
    <script src="./node_modules/prismjs/prism.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="./src/ui/prism-config.js"></script>
    <link rel="stylesheet" href="./src/styles/theme.css">
    <link rel="stylesheet" href="./src/styles/icons.css">
    <link rel="stylesheet" href="./src/styles/answer.css">
</head>
<body>
    <div class="main-container oc-window oc-window--native has-header">
        <!-- Draggable Header -->
        <div class="window-header oc-titlebar">
            <span class="oc-mark" aria-hidden="true"></span>
            <div class="window-title oc-title">Answer</div>
            <div class="answer-spacer"></div>
            <span id="answer-status" class="answer-status oc-label is-off" role="status"></span>
            <div class="window-controls">
                <button id="close-window-btn" class="oc-btn oc-btn--ghost oc-icon-btn" type="button" aria-label="Close" title="Close">
                    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>

        <div id="answer-body" class="answer-body">
            <!-- Shown only if the panel opens before anything was asked -->
            <div id="empty-state" class="answer-view answer-empty">
                <p class="answer-empty-title">No answer yet</p>
                <p class="answer-empty-hint">Ask with a screenshot, your voice or the chat, and the answer appears here.</p>
            </div>

            <!-- Loading State -->
            <div id="loading" class="answer-view loading is-off" aria-hidden="true">
                <p class="answer-label" aria-hidden="true">Say this</p>
                <!-- A pencil drafting the first line along the rule. -->
                <div class="draft" aria-hidden="true">
                    <div class="draft-line">
                        <svg class="draft-svg" viewBox="0 0 568 32" preserveAspectRatio="none" focusable="false"><path class="draft-path" pathLength="100" d="M2 25C64 23.5 118 26.5 182 24.8S302 23 366 25.2 480 26.4 548 24.4"/></svg>
                        <span class="draft-tip"></span>
                    </div>
                    <div class="draft-line draft-line--short">
                        <svg class="draft-svg" viewBox="0 0 568 32" preserveAspectRatio="none" focusable="false"><path class="draft-path" pathLength="100" d="M2 25C64 23.5 118 26.5 182 24.8S302 23 366 25.2"/></svg>
                    </div>
                </div>
                <div class="draft-rules" aria-hidden="true"></div>
                <div class="loading-text"><span id="loading-text" class="oc-shimmer">Thinking…</span></div>
                <p id="loading-hint" class="loading-hint is-off">The AI provider is taking longer than usual.</p>
            </div>

            <!-- Response Content -->
            <div id="response-content" class="answer-view content-area is-off" aria-hidden="true">
                <!-- Split Layout -->
                <div id="split-layout" class="answer-layout split-layout is-off">
                    <!-- Text Panel -->
                    <div class="text-panel">
                        <div class="panel-content" tabindex="0" role="region" aria-label="Answer">
                            <div id="text-content" class="markdown-content oc-prose"></div>
                        </div>
                    </div>

                    <!-- Code Panel -->
                    <div class="code-panel">
                        <div class="panel-content" tabindex="0" role="region" aria-label="Code">
                            <div id="code-content"></div>
                        </div>
                    </div>
                </div>

                <!-- Full Content (when no code detected) -->
                <div id="full-content" class="answer-layout full-content is-off">
                    <div class="full-content-inner" tabindex="0" role="region" aria-label="Answer">
                        <div id="full-markdown" class="markdown-content oc-prose"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/ui/answer-page.js"></script>
</body>
</html>
