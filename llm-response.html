<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuewell</title>
    <script src="./node_modules/dompurify/dist/purify.min.js"></script>
    <script src="lib/safe-html.js"></script>
    <script src="./node_modules/marked/lib/marked.umd.js"></script>
    <script src="./src/ui/markdown-render.js"></script>
    <script src="lib/mathrender.js"></script>
    <!-- PrismJS core (bundled with markup, css, clike and javascript) and the
         autoloader, which adds other languages from components/ on demand.
         Token colors come from theme.css. -->
    <script src="./node_modules/prismjs/prism.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="./src/ui/prism-config.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: transparent;
        }
        body {
            -webkit-app-region: no-drag;
        }

        .hidden { display: none !important; }

        /* ---------- Window surface ---------- */

        .main-container {
            display: flex;
            flex-direction: column;
        }

        /* Header: the drag region */
        .window-header {
            -webkit-app-region: drag;
            user-select: none;
        }
        .window-title {
            pointer-events: none;
            user-select: none;
        }
        .window-header .answer-spacer { flex: 1; }
        .answer-status.oc-label {
            color: var(--oc-accent);
            pointer-events: none;
        }
        .window-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-app-region: no-drag;
        }
        .window-controls svg { display: block; }

        /* ---------- Loading ---------- */

        .loading {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .loading-text {
            padding: 14px 20px;
            font-size: var(--oc-fs-md);
            font-weight: 600;
        }

        /* ---------- Content ---------- */

        .content-area {
            -webkit-app-region: no-drag;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .split-layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            overflow: hidden;
        }

        .text-panel,
        .code-panel {
            position: relative;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }
        .code-panel {
            background: var(--oc-sunken);
            border-left: 1px solid var(--oc-line);
        }

        .panel-content,
        .full-content-inner {
            height: 100%;
            box-sizing: border-box;
            overflow: auto;
            outline: none;
        }
        .text-panel .panel-content { padding: 16px 20px 20px; }
        .code-panel .panel-content { padding: 14px 16px; }

        .full-content {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }
        .full-content-inner { padding: 16px 20px 20px; }
        #full-markdown { max-width: 80ch; }

        /* Each panel scrolls on its own; theme.css draws the thin scrollbars. */

        .panel-content:focus-visible,
        .full-content-inner:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 1px var(--oc-accent-line);
        }

        .interactive-scrolling .panel-content,
        .interactive-scrolling .full-content-inner { cursor: grab; }
        .interactive-scrolling .panel-content:active,
        .interactive-scrolling .full-content-inner:active { cursor: grabbing; }

        /* Markdown: .oc-prose does the typography; these are page extras. */
        .markdown-content sup,
        .markdown-content sub {
            font-size: 0.72em;
            line-height: 0;
        }
        .math {
            font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', serif;
            white-space: nowrap;
        }

        /* Error callout (e.g. "Screen capture failed...") */
        .answer-error {
            padding: 10px 14px;
            color: var(--oc-text);
            background: var(--oc-error-soft);
            border-left: 2px solid var(--oc-error);
            border-radius: 0 var(--oc-r-sm) var(--oc-r-sm) 0;
        }

        /* ---------- Code panel ---------- */

        .code-block + .code-block {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--oc-line);
        }
        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 22px;
            margin-bottom: 8px;
        }
        .code-content pre {
            margin: 0;
            padding: 0;
            overflow-x: auto;
            background: none;
            border: 0;
        }
        .code-content code,
        .code-content pre[class*="language-"] {
            font-family: var(--oc-mono);
            font-size: 12.5px;
            line-height: 1.6;
            font-variant-ligatures: none;
            font-feature-settings: "calt" 0;
            white-space: pre;
            color: #e6e4dd;
            background: none;
        }
        .no-code {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--oc-text-3);
            font-size: var(--oc-fs-sm);
        }

        /* Copy buttons (class names are used by the script) */
        .copy-btn.oc-btn {
            height: 22px;
            padding: 0 8px;
            font-family: var(--oc-mono);
            font-size: var(--oc-fs-2xs);
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            -webkit-app-region: no-drag;
        }
        .copy-btn.copied,
        .copy-btn.copied:hover { color: var(--oc-accent); }
        .oc-prose pre .copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--oc-glass-pop);
            border-color: var(--oc-line);
        }
        .oc-prose pre .copy-btn:hover { background: var(--oc-raised-3); }
    </style>
    <link rel="stylesheet" href="./src/styles/theme.css">
</head>
<body>
    <div class="main-container oc-window oc-window--native has-header">
        <!-- Draggable Header -->
        <div class="window-header oc-titlebar">
            <span class="oc-mark" aria-hidden="true"></span>
            <div class="window-title oc-title">Answer</div>
            <div class="answer-spacer"></div>
            <span id="answer-status" class="answer-status oc-label" role="status">Thinking</span>
            <div class="window-controls">
                <button id="close-window-btn" class="oc-btn oc-btn--ghost oc-icon-btn" type="button" aria-label="Close" title="Close">
                    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="oc-progress" aria-hidden="true"></div>
            <div class="loading-text"><span class="oc-shimmer">Thinking…</span></div>
        </div>

        <!-- Response Content -->
        <div id="response-content" class="content-area hidden">
            <!-- Split Layout -->
            <div id="split-layout" class="split-layout hidden">
                <!-- Text Panel -->
                <div class="text-panel">
                    <div class="panel-content" tabindex="0">
                        <div id="text-content" class="markdown-content oc-prose"></div>
                    </div>
                </div>

                <!-- Code Panel -->
                <div class="code-panel">
                    <div class="panel-content" tabindex="0">
                        <div id="code-content"></div>
                    </div>
                </div>
            </div>

            <!-- Full Content (when no code detected) -->
            <div id="full-content" class="full-content hidden">
                <div class="full-content-inner" tabindex="0">
                    <div id="full-markdown" class="markdown-content oc-prose"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="./src/ui/answer-page.js"></script>
</body>
</html>
