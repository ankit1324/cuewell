<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Super Interview: calm, complete answers in every interview round.</title>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#141511" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <pattern id="dgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <clipPath id="key"><rect x="72" y="72" width="56" height="56" rx="15.7"/></clipPath>
    <clipPath id="stage"><rect x="704" y="96" width="432" height="438" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f7f6f2"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand -->
  <g clip-path="url(#key)">
    <rect x="72" y="72" width="56" height="56" fill="#c9f26b"/>
    <rect x="72" y="123.5" width="56" height="4.5" fill="#000" fill-opacity=".25"/>
  </g>
  <path d="M108 89.8c-1.6-2.6-4.5-4.2-8-4.2-4.7 0-8.2 2.6-8.2 6.3 0 3.7 2.8 5.3 8.2 6.5 5.6 1.2 8.6 3 8.6 6.8 0 4-3.7 6.6-8.6 6.6-3.8 0-7-1.6-8.6-4.4" fill="none" stroke="#141a08" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="146" y="110" font-family="Manrope, 'Manrope Variable', -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="750" letter-spacing="-0.4" fill="#141511">Super Interview</text>

  <!-- Eyebrow -->
  <text x="72" y="216" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="17" font-weight="550" letter-spacing="1.6" fill="#5f6058">AI INTERVIEW COPILOT · FREE AND OPEN SOURCE</text>

  <!-- Headline with lime marker -->
  <rect x="68" y="398" width="474" height="30" fill="#c9f26b"/>
  <text font-family="Manrope, 'Manrope Variable', -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="750" letter-spacing="-2.2" fill="#141511">
    <tspan x="72" y="290">Calm, complete</tspan>
    <tspan x="72" y="356">answers in every</tspan>
    <tspan x="72" y="422">interview round.</tspan>
  </text>

  <text x="72" y="530" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="17" fill="#5f6058">Voice · Screenshot · Chat   →   streamed answer</text>
  <text x="72" y="562" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="17" fill="#5f6058">macOS 13+ · Windows 10+ · Bring your own AI</text>

  <!-- Dark product stage -->
  <g clip-path="url(#stage)">
    <rect x="704" y="96" width="432" height="438" fill="#0e0f0c"/>
    <rect x="704" y="96" width="432" height="438" fill="url(#dgrid)"/>
  </g>

  <!-- Toolbar pill -->
  <rect x="744" y="132" width="352" height="40" rx="20" fill="#0d0e11" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="756" y="144" width="16" height="16" rx="4.5" fill="#c9f26b"/>
  <text x="764" y="156.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="800" fill="#141a08">S</text>
  <rect x="786" y="143" width="58" height="18" rx="5" fill="#ffffff" fill-opacity=".07"/>
  <text x="815" y="156" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#b5b7bd">⌘ ⇧ S</text>
  <rect x="852" y="138" width="92" height="28" rx="14" fill="#ff5f57" fill-opacity=".15"/>
  <circle cx="868" cy="152" r="3.5" fill="#ff5f57"/>
  <text x="880" y="156.5" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#ff5f57">Listening</text>
  <rect x="954" y="138" width="96" height="28" rx="14" fill="#c9f26b" fill-opacity=".13" stroke="#c9f26b" stroke-opacity=".38"/>
  <text x="1002" y="156.5" text-anchor="middle" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9f26b">Technical</text>
  <circle cx="1074" cy="152" r="3.5" fill="#c9f26b"/>

  <!-- Answer panel -->
  <rect x="744" y="190" width="352" height="306" rx="10" fill="#121317" stroke="#ffffff" stroke-opacity=".14"/>
  <rect x="758" y="204" width="14" height="14" rx="4" fill="#c9f26b"/>
  <text x="782" y="215.5" font-family="Manrope, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="650" fill="#f2f1ec">Answer</text>
  <text x="1080" y="215" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.8" fill="#c9f26b">STREAMING</text>
  <line x1="744" y1="230" x2="1096" y2="230" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="760" y="246" width="320" height="70" rx="4" fill="#c9f26b" fill-opacity=".13"/>
  <rect x="760" y="246" width="2" height="70" fill="#c9f26b"/>
  <text x="774" y="266" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="600" letter-spacing="0.8" fill="#c9f26b">SAY THIS FIRST</text>
  <text font-family="Manrope, -apple-system, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#ffffff">
    <tspan x="774" y="287">TypeScript is JavaScript plus a static</tspan>
    <tspan x="774" y="305">type system that compiles away.</tspan>
  </text>
  <g fill="#ffffff" fill-opacity=".14">
    <rect x="760" y="336" width="290" height="8" rx="4"/>
    <rect x="760" y="356" width="246" height="8" rx="4"/>
    <rect x="760" y="376" width="270" height="8" rx="4"/>
  </g>
  <rect x="760" y="400" width="320" height="80" rx="8" fill="#000000" fill-opacity=".32" stroke="#ffffff" stroke-opacity=".08"/>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12">
    <text x="774" y="424"><tspan fill="#c9f26b">function</tspan><tspan fill="#8fd0ff"> total</tspan><tspan fill="#a3a8b2">(</tspan><tspan fill="#e6e4dd">items</tspan><tspan fill="#a3a8b2">:</tspan><tspan fill="#8fd0ff"> Item</tspan><tspan fill="#a3a8b2">[]):</tspan><tspan fill="#8fd0ff"> number</tspan></text>
    <text x="774" y="444" fill="#e6e4dd">  <tspan fill="#c9f26b">return</tspan> items<tspan fill="#a3a8b2">.</tspan><tspan fill="#8fd0ff">reduce</tspan><tspan fill="#a3a8b2">(</tspan></text>
    <text x="774" y="464" fill="#e6e4dd">    <tspan fill="#a3a8b2">(</tspan>sum, i<tspan fill="#a3a8b2">)</tspan> =&gt; sum + i.price, <tspan fill="#ffab85">0</tspan><tspan fill="#a3a8b2">);</tspan></text>
  </g>
</svg>
